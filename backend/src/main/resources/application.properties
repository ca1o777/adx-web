spring.application.name=adx

# Banco SQLite no arquivo adx.db (relativo à pasta backend/, fora do Git)
spring.datasource.url=jdbc:sqlite:adx.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# O SQLite aceita um escritor por vez; uma única conexão evita "database is locked"
spring.datasource.hikari.maximum-pool-size=1
# O SQLite só confere chaves estrangeiras com este PRAGMA ligado em cada conexão
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON

# As tabelas são criadas pelo schema.sql (CREATE TABLE IF NOT EXISTS) a cada inicialização
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false

# Páginas do frontend: lidas da raiz do repositório (relativa à pasta backend/), ver WebConfig
adx.frontend.diretorio=..
# Desliga o mapeamento estático padrão (/**); só o WebConfig decide o que é servido
spring.web.resources.add-mappings=false

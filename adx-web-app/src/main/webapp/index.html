<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | ADX – Aplicativo de Xadrez</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-tela="login">
  <main class="acesso login-acesso">
    <section class="login-capa" aria-label="ADX — Aplicativo de Xadrez">
      <div class="login-marca">
        <strong>ADX</strong>
        <span>Aplicativo de Xadrez</span>
      </div>
      <div class="login-cena" aria-hidden="true">
        <div class="login-tabuleiro">
          <span class="login-luz" id="luz-tabuleiro"></span>
          <span class="login-peca login-rei-escuro"></span>
          <span class="login-peca login-torre"></span>
          <span class="login-peca login-rei-claro"></span>
        </div>
      </div>
      <p class="login-descricao">Registre suas partidas, acompanhe seu desempenho e dispute o ranking.</p>
    </section>
    <section class="acesso-form">
      <div class="formulario">
        <h1>Entrar</h1>
        <p class="subtitulo">Acesse com o e-mail e a senha cadastrados.</p>
        <div class="mensagem" id="mensagem" role="status" aria-live="polite" aria-atomic="true"></div>
        <form id="form-login" novalidate>
          <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" aria-describedby="email-erro" required>
            <span class="erro" id="email-erro"></span>
          </div>
          <div class="campo">
            <label for="senha">Senha</label>
            <div class="campo-senha"><input id="senha" name="senha" type="password" autocomplete="current-password" aria-describedby="senha-erro" required><button type="button" class="mostrar-senha" aria-controls="senha" aria-pressed="false">Mostrar</button></div>
            <span class="erro" id="senha-erro"></span>
          </div>
          <div class="linha-link"><a href="recuperar-senha.html" id="esqueci">Esqueci minha senha</a></div>
          <button class="botao botao-primario botao-largo" type="submit">Entrar</button>
        </form>
        <p class="rodape-form">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
      </div>
    </section>
  </main>
  <script src="assets/js/app.js"></script>
</body>
</html>
